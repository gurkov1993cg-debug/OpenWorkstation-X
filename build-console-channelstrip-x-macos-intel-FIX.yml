name: Build Console Channel Strip X macOS Intel FIX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate source ZIP
        shell: bash
        run: |
          ZIP=$(find . -name 'ConsoleChannelStrip-X-v0.1-source.zip' -print -quit)
          test -n "$ZIP" || { echo 'Source ZIP not found'; exit 1; }
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Expand source
        shell: bash
        run: |
          mkdir -p channelstrip-src
          ditto -x -k "$SOURCE_ZIP" channelstrip-src
          ROOT=$(find channelstrip-src -maxdepth 2 -name CMakeLists.txt -print -quit | xargs dirname)
          test -n "$ROOT" || { echo 'CMake root not found'; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Patch JUCE for current macOS SDK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ['PROJECT_ROOT']) / 'CMakeLists.txt'
          s = p.read_text()
          old = 'GIT_TAG 7.0.12'
          new = 'GIT_TAG 8.0.11'
          if old not in s:
              raise SystemExit(f'Expected JUCE tag not found in {p}')
          p.write_text(s.replace(old, new))
          print('Patched JUCE 7.0.12 -> 8.0.11')
          PY

      - name: Configure Intel VST3
        shell: bash
        run: |
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4

      - name: Verify Intel and deployment target
        shell: bash
        run: |
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          test -n "$VST" || { echo 'VST3 bundle not found'; exit 1; }
          BIN="$VST/Contents/MacOS/Console Channel Strip X"
          file "$BIN"
          file "$BIN" | grep -q 'x86_64' || { echo 'Not an Intel x86_64 binary'; exit 1; }
          otool -l "$BIN" | grep -A 4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifact
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          test -n "$VST" || { echo 'VST3 bundle not found'; exit 1; }
          ditto "$VST" 'artifact/Console Channel Strip X.vst3'
          ditto -c -k --sequesterRsrc --keepParent 'artifact/Console Channel Strip X.vst3' ConsoleChannelStrip-X-v0.1-macOS-Intel.zip

      - name: Upload Intel VST3
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleChannelStrip-X-v0.1-macOS-Intel
          path: ConsoleChannelStrip-X-v0.1-macOS-Intel.zip
          if-no-files-found: error
          retention-days: 30
