      - name: Configure Intel macOS 10.13 target
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/CG4K-Channel"
          cmake -S "$project_dir" -B "$project_dir/build-macos" -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/CG4K-Channel"
          cmake --build "$project_dir/build-macos" --config Release \
            --target CG4KChannel_VST3 --parallel 4

      - name: Package and verify
        shell: bash
        run: |
          set -euo pipefail
          project_dir="$RUNNER_TEMP/CG4K-Channel"
          dist_dir="$RUNNER_TEMP/dist"
          plugin_path="$(find "$project_dir/build-macos" -type d \
            -name 'CG4K Channel.vst3' -print -quit)"
          test -n "$plugin_path"
          binary_path="$plugin_path/Contents/MacOS/CG4K Channel"
          test -f "$binary_path"
          file "$binary_path" | grep -q 'x86_64'
          codesign --force --deep --sign - "$plugin_path"
          codesign --verify --deep --strict "$plugin_path"

          package_dir="$dist_dir/CG4K-Channel-v0.1.0-macOS-Intel"
          mkdir -p "$package_dir"
          ditto "$plugin_path" "$package_dir/CG4K Channel.vst3"
          cp "$project_dir/scripts/install-mac.command" \
            "$package_dir/Install CG4K Channel.command"
          chmod +x "$package_dir/Install CG4K Channel.command"
          cp "$project_dir/README-BG.md" "$package_dir/README-BG.md"
          cp "$project_dir/RESEARCH-NOTES.md" "$package_dir/RESEARCH-NOTES.md"
          cp "$project_dir/LICENSE" "$package_dir/LICENSE"

          {
            echo "CG4K Channel v0.1.0"
            echo "Target: Intel x86_64, macOS 10.13+"
            file "$binary_path"
            echo
            xcrun vtool -show-build "$binary_path" || true
            echo
            codesign -dv --verbose=2 "$plugin_path" 2>&1
          } > "$package_dir/BUILD-INFO.txt"

          ditto -c -k --sequesterRsrc --keepParent "$package_dir" \
            "$dist_dir/CG4K-Channel-v0.1.0-macOS-Intel.zip"
          rm -rf "$project_dir/build-macos"
          ditto -c -k --keepParent "$project_dir" \
            "$dist_dir/CG4K-Channel-v0.1.0-Source.zip"

      - name: Upload ready plug-in
        uses: actions/upload-artifact@v4
        with:
          name: CG4K-Channel-v0.1.0-macOS-Intel
          path: |
            ${{ runner.temp }}/dist/CG4K-Channel-v0.1.0-macOS-Intel.zip
            ${{ runner.temp }}/dist/CG4K-Channel-v0.1.0-Source.zip
          compression-level: 0
          if-no-files-found: error

