name: Build Console Channel Strip X v0.4.1 Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
      - '.github/workflows/build-console-channelstrip-x-windows.yml'

concurrency:
  group: console-channelstrip-x-v041-windows
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand v0.4.1 source
        shell: pwsh
        run: |
          $zip = 'ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'v0.4.1 source ZIP not found' }
          Remove-Item -Recurse -Force channelstrip-src -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath channelstrip-src -Force
          $cmake = Get-ChildItem -Path channelstrip-src -Recurse -Filter CMakeLists.txt -File |
            Select-Object -First 1
          if ($null -eq $cmake) { throw 'CMake root not found in v0.4.1 ZIP' }
          $root = $cmake.Directory.FullName
          "PROJECT_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Project root: $root"

      - name: Configure Windows x64 VST3 and C++ tests
        shell: pwsh
        run: |
          cmake -S "$env:PROJECT_ROOT" -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build DSP and RC tests
        shell: pwsh
        run: |
          cmake --build build --config Release --target ConsoleChannelStripXSmokeTests --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run DSP and RC tests
        shell: pwsh
        run: |
          $test = Get-ChildItem -Path build -Recurse -Filter ConsoleChannelStripXSmokeTests.exe -File |
            Select-Object -First 1
          if ($null -eq $test) { throw 'DSP/RC test executable not found' }
          & $test.FullName 2>&1 | Tee-Object -FilePath parameter-smoke-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GUI smoke test
        shell: pwsh
        run: |
          cmake --build build --config Release --target ConsoleChannelStripXGuiSmokeTests --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run GUI smoke test
        shell: pwsh
        run: |
          $gui = Get-ChildItem -Path build -Recurse -Filter ConsoleChannelStripXGuiSmokeTests.exe -File |
            Select-Object -First 1
          if ($null -eq $gui) { throw 'GUI smoke-test executable not found' }
          & $gui.FullName 2>&1 | Tee-Object -FilePath gui-layout-smoke-tests.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath 'gui-preview-v0.4.1.png')) { throw 'GUI preview was not rendered' }

      - name: Build Windows x64 VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows x64 VST3
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter 'Console Channel Strip X.vst3' |
            Select-Object -First 1
          if ($null -eq $vst) { throw 'VST3 bundle not found' }

          $bin = Get-ChildItem -LiteralPath $vst.FullName -Recurse -File |
            Where-Object { $_.Name -eq 'Console Channel Strip X.vst3' } |
            Select-Object -First 1
          if ($null -eq $bin) { throw 'VST3 executable not found inside bundle' }

          $bytes = [System.IO.File]::ReadAllBytes($bin.FullName)
          if ($bytes.Length -lt 256) { throw 'VST3 executable is unexpectedly small' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or ($peOffset + 6) -gt $bytes.Length) { throw 'Invalid PE header' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $machineHex = ('0x{0:X4}' -f $machine)
          @(
            "Bundle: $($vst.FullName)",
            "Binary: $($bin.FullName)",
            "PE machine: $machineHex",
            "Expected AMD64: 0x8664"
          ) | Set-Content -LiteralPath binary-info.txt -Encoding utf8
          Get-Content binary-info.txt
          if ($machine -ne 0x8664) { throw "ERROR: binary is not Windows x64/AMD64 ($machineHex)" }

          "VST3_BUNDLE=$($vst.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Collect Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item -LiteralPath parameter-smoke-tests.txt, gui-layout-smoke-tests.txt, binary-info.txt, gui-preview-v0.4.1.png -Destination artifact
          $zipOut = Join-Path $PWD 'ConsoleChannelStrip-X-v0.4.1-Windows-x64.zip'
          if (Test-Path -LiteralPath $zipOut) { Remove-Item -LiteralPath $zipOut -Force }
          Compress-Archive -LiteralPath "$env:VST3_BUNDLE" -DestinationPath $zipOut -CompressionLevel Optimal
          if (-not (Test-Path -LiteralPath $zipOut)) { throw 'Windows VST3 ZIP was not created' }

      - name: Upload Windows x64 VST3
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleChannelStrip-X-v0.4.1-Windows-x64
          path: |
            ConsoleChannelStrip-X-v0.4.1-Windows-x64.zip
            artifact/binary-info.txt
            artifact/parameter-smoke-tests.txt
            artifact/gui-layout-smoke-tests.txt
            artifact/gui-preview-v0.4.1.png
          if-no-files-found: error
          retention-days: 30
