name: Build Console Channel Strip X v0.2 macOS Intel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate v0.2 source ZIP
        shell: bash
        run: |
          ZIP=$(find . -name 'ConsoleChannelStrip-X-v0.2-source.zip' -print -quit)
          test -n "$ZIP" || { echo 'v0.2 source ZIP not found'; exit 1; }
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Expand source
        shell: bash
        run: |
          rm -rf channelstrip-src
          mkdir -p channelstrip-src
          ditto -x -k "$SOURCE_ZIP" channelstrip-src
          ROOT=$(find channelstrip-src -maxdepth 2 -name CMakeLists.txt -print -quit | xargs dirname)
          test -n "$ROOT" || { echo 'CMake root not found'; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Audit visible parameter wiring
        shell: bash
        run: |
          python3 - "$PROJECT_ROOT" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])
          proc = (root / 'src/PluginProcessor.cpp').read_text()
          edit = (root / 'src/PluginEditor.cpp').read_text()
          ids = set(re.findall(r'(?:makeFloat|makeBool) \("([^"]+)"', proc))
          ids.update(re.findall(r'AudioParameterChoice> \("([^"]+)"', proc))
          controls = set(re.findall(r'add(?:Knob|Button) \("([^"]+)"', edit))
          controls.update(re.findall(r'ComboAttachment> \(audioProcessor\.parameters\(\), "([^"]+)"', edit))
          reads = set(re.findall(r'v \("([^"]+)"\)', proc))
          missing = sorted(controls - ids)
          invisible = sorted(ids - controls)
          unread = sorted(ids - reads)
          if missing or invisible or unread:
              print('Controls without parameters:', missing)
              print('Parameters without visible controls:', invisible)
              print('Parameters not read into DSP:', unread)
              raise SystemExit(1)
          print(f'Parameter wiring audit passed: {len(ids)} visible parameters, all read into DSP.')
          PY

      - name: Configure Intel VST3 and tests
        shell: bash
        run: |
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP smoke tests
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripXSmokeTests --parallel 4

      - name: Run DSP smoke tests
        shell: bash
        run: |
          TEST_BIN=$(find build -type f -name 'ConsoleChannelStripXSmokeTests' -perm +111 -print -quit)
          test -n "$TEST_BIN" || { echo 'Smoke-test executable not found'; exit 1; }
          "$TEST_BIN" | tee parameter-smoke-tests.txt

      - name: Build VST3
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4

      - name: Verify Intel and High Sierra target
        shell: bash
        run: |
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          test -n "$VST" || { echo 'VST3 bundle not found'; exit 1; }
          BIN="$VST/Contents/MacOS/Console Channel Strip X"
          test -f "$BIN" || { echo 'VST3 executable not found'; exit 1; }

          file "$BIN" | tee binary-info.txt
          file "$BIN" | grep -q 'x86_64' || { echo 'ERROR: binary is not x86_64'; exit 1; }

          VTOOL_OUTPUT=$(xcrun vtool -show-build "$BIN")
          printf '%s\n' "$VTOOL_OUTPUT" | tee deployment-info.txt
          MINOS=$(printf '%s\n' "$VTOOL_OUTPUT" | awk '
            $1 == "minos" { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { legacy=1; next }
            legacy && $1 == "version" { print $2; exit }
          ')
          test -n "$MINOS" || { echo 'Could not determine deployment target'; exit 1; }
          echo "Detected minimum macOS: $MINOS"
          python3 - "$MINOS" <<'PY'
          import sys
          parts = tuple(int(x) for x in sys.argv[1].split('.')[:2])
          if parts > (10, 13):
              raise SystemExit(f'ERROR: deployment target {sys.argv[1]} is newer than macOS 10.13')
          PY

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifact
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          ditto "$VST" 'artifact/Console Channel Strip X.vst3'
          cp binary-info.txt deployment-info.txt parameter-smoke-tests.txt artifact/
          ditto -c -k --sequesterRsrc --keepParent 'artifact/Console Channel Strip X.vst3' ConsoleChannelStrip-X-v0.2-macOS-Intel.zip

      - name: Upload Intel VST3
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleChannelStrip-X-v0.2-macOS-Intel
          path: |
            ConsoleChannelStrip-X-v0.2-macOS-Intel.zip
            artifact/binary-info.txt
            artifact/deployment-info.txt
            artifact/parameter-smoke-tests.txt
          if-no-files-found: error
          retention-days: 30
