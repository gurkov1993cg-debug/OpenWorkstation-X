name: Build OpenWorkstation-X Android v0.3

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android v0.3 project
        run: unzip -o OpenWorkstation-X-Android-v0.3.zip -d .

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK v0.3
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK v0.3
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorkstation-X-Android-v0.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
