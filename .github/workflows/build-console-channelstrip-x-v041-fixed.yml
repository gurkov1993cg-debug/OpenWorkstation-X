name: Build Console Channel Strip X v0.4.1 Wien RC EQ

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
      - '.github/workflows/build-console-channelstrip-x-v041.yml'

concurrency:
  group: console-channelstrip-x-v041
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand v0.4.1 source
        shell: bash
        run: |
          ZIP='ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
          test -f "$ZIP" || { echo 'v0.4.1 source ZIP not found'; exit 1; }
          rm -rf channelstrip-src
          mkdir -p channelstrip-src
          ditto -x -k "$ZIP" channelstrip-src
          ROOT=$(find channelstrip-src -maxdepth 3 -name CMakeLists.txt -print -quit | xargs dirname)
          test -n "$ROOT" || { echo 'CMake root not found in v0.4.1 ZIP'; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Configure Intel VST3 and C++ tests
        shell: bash
        run: |
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP and RC tests
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripXSmokeTests --parallel 4

      - name: Run DSP and RC tests
        shell: bash
        run: |
          TEST_BIN=$(find build -type f -name 'ConsoleChannelStripXSmokeTests' -perm +111 -print -quit)
          test -n "$TEST_BIN" || { echo 'DSP/RC test executable not found'; exit 1; }
          "$TEST_BIN" | tee parameter-smoke-tests.txt

      - name: Build GUI smoke test
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripXGuiSmokeTests --parallel 4

      - name: Run GUI smoke test
        shell: bash
        run: |
          GUI_TEST=$(find build -type f -name 'ConsoleChannelStripXGuiSmokeTests' -perm +111 -print -quit)
          test -n "$GUI_TEST" || { echo 'GUI smoke-test executable not found'; exit 1; }
          "$GUI_TEST" | tee gui-layout-smoke-tests.txt
          test -f gui-preview-v0.4.1.png || { echo 'GUI preview was not rendered'; exit 1; }

      - name: Build VST3
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4

      - name: Verify Intel and macOS 10.13 target
        shell: bash
        run: |
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          test -n "$VST" || { echo 'VST3 bundle not found'; exit 1; }
          BIN="$VST/Contents/MacOS/Console Channel Strip X"
          test -f "$BIN" || { echo 'VST3 executable not found'; exit 1; }
          file "$BIN" | tee binary-info.txt
          file "$BIN" | grep -q 'x86_64' || { echo 'ERROR: binary is not x86_64'; exit 1; }
          VTOOL_OUTPUT=$(xcrun vtool -show-build "$BIN")
          printf '%s\n' "$VTOOL_OUTPUT" | tee deployment-info.txt
          MINOS=$(printf '%s\n' "$VTOOL_OUTPUT" | awk '
            $1 == "minos" { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { legacy=1; next }
            legacy && $1 == "version" { print $2; exit }
          ')
          test -n "$MINOS" || { echo 'Could not determine deployment target'; exit 1; }
          awk -v v="$MINOS" 'BEGIN {
            split(v, a, "."); major=a[1]+0; minor=a[2]+0;
            if (major > 10 || (major == 10 && minor > 13)) exit 1;
          }' || { echo "ERROR: deployment target $MINOS is newer than macOS 10.13"; exit 1; }

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifact
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          ditto "$VST" 'artifact/Console Channel Strip X.vst3'
          cp binary-info.txt deployment-info.txt parameter-smoke-tests.txt gui-layout-smoke-tests.txt gui-preview-v0.4.1.png artifact/
          ditto -c -k --sequesterRsrc --keepParent 'artifact/Console Channel Strip X.vst3' ConsoleChannelStrip-X-v0.4.1-macOS-Intel.zip

      - name: Upload Intel VST3
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleChannelStrip-X-v0.4.1-macOS-Intel
          path: |
            ConsoleChannelStrip-X-v0.4.1-macOS-Intel.zip
            artifact/binary-info.txt
            artifact/deployment-info.txt
            artifact/parameter-smoke-tests.txt
            artifact/gui-layout-smoke-tests.txt
            artifact/gui-preview-v0.4.1.png
          if-no-files-found: error
          retention-days: 30
