name: Build Silveton Channel Strip v0.5.0 macOS Intel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
      - '.github/workflows/build-silveton-v050-macos-intel.yml'

concurrency:
  group: silveton-channel-strip-v050-macos-intel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand locked v0.4.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          ZIP='ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
          test -f "$ZIP" || { echo 'Locked v0.4.1 source ZIP not found'; exit 1; }
          rm -rf silveton-src build artifact
          mkdir -p silveton-src
          ditto -x -k "$ZIP" silveton-src
          CMAKE_FILE=$(find silveton-src -maxdepth 4 -name CMakeLists.txt -print -quit)
          test -n "$CMAKE_FILE" || { echo 'CMakeLists.txt not found in v0.4.1 source'; exit 1; }
          ROOT=$(dirname "$CMAKE_FILE")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Fingerprint locked DSP before GUI change
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_ROOT/src" -maxdepth 1 -type f \
            \( -name 'DspEngine.*' -o -name 'ConsoleDspPrimitives.h' -o -name 'AnalogSaturationCircuit.*' \
               -o -name 'SslDynamicsCircuit.*' -o -name 'DynamicsCircuitFactory.h' -o -name 'WienEqModel.*' \
               -o -name 'SslEseriesEqModel.*' \) -print0 \
            | sort -z | xargs -0 shasum -a 256 > dsp-source-hashes-before.txt
          cat dsp-source-hashes-before.txt

