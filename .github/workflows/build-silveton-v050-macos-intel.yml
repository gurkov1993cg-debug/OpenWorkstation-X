            cmV0dXJuIDA7Cn0K
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, os, re

          root = Path(os.environ['PROJECT_ROOT'])
          payloads = {
              'src/PluginEditor.h': os.environ['EDITOR_H_B64'],
              'src/PluginEditor.cpp': os.environ['EDITOR_CPP_B64'],
              'tests/GuiLayoutSmokeTests.cpp': os.environ['GUI_TEST_B64'],
          }
          for rel, data in payloads.items():
              p = root / rel
              p.write_bytes(base64.b64decode(''.join(data.split())))
              print('installed', rel, p.stat().st_size, 'bytes')

          cmake = root / 'CMakeLists.txt'
          s = cmake.read_text()

          def sub_once(pattern, replacement, label):
              global s
              s2, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit(f'Could not patch {label}: expected one match, got {n}')
              s = s2

          sub_once(r'project\(ConsoleChannelStripX VERSION [0-9.]+ LANGUAGES C CXX\)',
                   'project(ConsoleChannelStripX VERSION 0.5.0 LANGUAGES C CXX)', 'project version')
          sub_once(r'COMPANY_NAME "OpenWorkstation X"', 'COMPANY_NAME "Silveton"', 'company')
          sub_once(r'BUNDLE_ID "com\.openworkstationx\.consolechannelstripx"',
                   'BUNDLE_ID "com.silveton.channelstrip"', 'bundle id')
          sub_once(r'PLUGIN_MANUFACTURER_CODE OwX1', 'PLUGIN_MANUFACTURER_CODE SilV', 'manufacturer code')
          sub_once(r'PLUGIN_CODE CsX1', 'PLUGIN_CODE SCS5', 'plugin code')
          sub_once(r'PRODUCT_NAME "Console Channel Strip X"', 'PRODUCT_NAME "Silveton Channel Strip"', 'product name')
          sub_once(r'DESCRIPTION "E-series inspired console channel strip"',
                   'DESCRIPTION "Silveton Channel Strip"', 'description')
          sub_once(r'JucePlugin_Name="Console Channel Strip X"',
                   'JucePlugin_Name="Silveton Channel Strip"', 'GUI test plugin name')
          cmake.write_text(s)

          editor = (root / 'src/PluginEditor.cpp').read_text()
          forbidden = ['TUBE', 'TAPE', 'SOLID STATE', 'MID/SIDE', 'BASS MONO', 'KNEE', 'MAKEUP']
          for word in forbidden:
              if word in editor.upper():
                  raise SystemExit('Non-DSP-backed visible control leaked into GUI: ' + word)
          print('PASS: GUI contains only controls backed by existing v0.4.1 DSP parameters')
          PYCODE

      - name: Verify DSP source stayed byte-identical
        shell: bash
        run: |
          set -euo pipefail
          find "$PROJECT_ROOT/src" -maxdepth 1 -type f \
            \( -name 'DspEngine.*' -o -name 'ConsoleDspPrimitives.h' -o -name 'AnalogSaturationCircuit.*' \
               -o -name 'SslDynamicsCircuit.*' -o -name 'DynamicsCircuitFactory.h' -o -name 'WienEqModel.*' \
               -o -name 'SslEseriesEqModel.*' \) -print0 \
            | sort -z | xargs -0 shasum -a 256 > dsp-source-hashes-after.txt
          diff -u dsp-source-hashes-before.txt dsp-source-hashes-after.txt
          echo 'PASS: locked v0.4.1 DSP source is unchanged'

      - name: Configure Intel VST3 for macOS 10.13
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and run locked DSP regression tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target ConsoleChannelStripXSmokeTests --parallel 4
          TEST_BIN=$(find build -type f -name 'ConsoleChannelStripXSmokeTests' -perm +111 -print -quit)
          test -n "$TEST_BIN" || { echo 'DSP test executable not found'; exit 1; }
          "$TEST_BIN" | tee parameter-smoke-tests.txt

      - name: Build and run Silveton GUI functional tests
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target ConsoleChannelStripXGuiSmokeTests --parallel 4
          GUI_TEST=$(find build -type f -name 'ConsoleChannelStripXGuiSmokeTests' -perm +111 -print -quit)
          test -n "$GUI_TEST" || { echo 'GUI test executable not found'; exit 1; }
          "$GUI_TEST" | tee gui-functional-tests.txt
          test -f gui-preview-silveton-v0.5.0.png || { echo 'Silveton preview PNG was not rendered'; exit 1; }

      - name: Build Silveton VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4

      - name: Verify VST3 identity, Intel architecture and deployment target
        shell: bash
        run: |
          set -euo pipefail
          VST=$(find build -type d -name 'Silveton Channel Strip.vst3' -print -quit)
          test -n "$VST" || { echo 'Silveton Channel Strip.vst3 not found'; find build -type d -name '*.vst3' -print; exit 1; }
          BIN="$VST/Contents/MacOS/Silveton Channel Strip"
          test -f "$BIN" || { echo 'Silveton VST3 executable not found'; find "$VST" -maxdepth 4 -print; exit 1; }
          file "$BIN" | tee binary-info.txt
          file "$BIN" | grep -q 'x86_64' || { echo 'ERROR: binary is not x86_64'; exit 1; }

          VTOOL_OUTPUT=$(xcrun vtool -show-build "$BIN")
          printf '%s\n' "$VTOOL_OUTPUT" | tee deployment-info.txt
          MINOS=$(printf '%s\n' "$VTOOL_OUTPUT" | awk '
            $1 == "minos" { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { legacy=1; next }
            legacy && $1 == "version" { print $2; exit }
          ')
          test -n "$MINOS" || { echo 'Could not determine deployment target'; exit 1; }
          awk -v v="$MINOS" 'BEGIN {
            split(v, a, "."); major=a[1]+0; minor=a[2]+0;
            if (major > 10 || (major == 10 && minor > 13)) exit 1;
          }' || { echo "ERROR: deployment target $MINOS is newer than macOS 10.13"; exit 1; }
          echo "SILVETON_VST3=$VST" >> "$GITHUB_ENV"

      - name: Package Mac plugin and full patched source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          ditto "$SILVETON_VST3" 'artifact/Silveton Channel Strip.vst3'
          cp binary-info.txt deployment-info.txt parameter-smoke-tests.txt gui-functional-tests.txt \
             dsp-source-hashes-before.txt dsp-source-hashes-after.txt gui-preview-silveton-v0.5.0.png artifact/
          ditto -c -k --sequesterRsrc --keepParent 'artifact/Silveton Channel Strip.vst3' \
             Silveton-Channel-Strip-v0.5.0-macOS-Intel.zip
          ditto -c -k --sequesterRsrc --keepParent "$PROJECT_ROOT" \
             Silveton-Channel-Strip-v0.5.0-source.zip

      - name: Upload Silveton v0.5.0
        uses: actions/upload-artifact@v4
        with:
          name: Silveton-Channel-Strip-v0.5.0-macOS-Intel
          path: |
            Silveton-Channel-Strip-v0.5.0-macOS-Intel.zip
            Silveton-Channel-Strip-v0.5.0-source.zip
            artifact/gui-preview-silveton-v0.5.0.png
            artifact/parameter-smoke-tests.txt
            artifact/gui-functional-tests.txt
            artifact/binary-info.txt
            artifact/deployment-info.txt
            artifact/dsp-source-hashes-before.txt
            artifact/dsp-source-hashes-after.txt
          if-no-files-found: error
          retention-days: 30
