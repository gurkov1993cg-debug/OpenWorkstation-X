name: Build Console Channel Strip X v0.1.1 macOS Intel FIX v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate v0.1.1 source ZIP
        shell: bash
        run: |
          ZIP=$(find . -name 'ConsoleChannelStrip-X-v0.1.1-source.zip' -print -quit)
          test -n "$ZIP" || { echo 'v0.1.1 source ZIP not found'; exit 1; }
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Expand source
        shell: bash
        run: |
          mkdir -p channelstrip-src
          ditto -x -k "$SOURCE_ZIP" channelstrip-src
          ROOT=$(find channelstrip-src -maxdepth 2 -name CMakeLists.txt -print -quit | xargs dirname)
          test -n "$ROOT" || { echo 'CMake root not found'; exit 1; }
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Ensure JUCE generated header
        shell: bash
        run: |
          python3 - "$PROJECT_ROOT/CMakeLists.txt" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()
          line = 'juce_generate_juce_header(ConsoleChannelStripX)'

          if line not in s:
              needle = ')\n\ntarget_sources(ConsoleChannelStripX PRIVATE\n'
              replacement = ')\n\n' + line + '\n\ntarget_sources(ConsoleChannelStripX PRIVATE\n'
              if needle not in s:
                  raise SystemExit('Could not locate JUCE header insertion point')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)

          print('JUCE header generation enabled')
          PY

      - name: Configure Intel VST3
        shell: bash
        run: |
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: bash
        run: cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4

      - name: Verify Intel and High Sierra target
        shell: bash
        run: |
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          test -n "$VST" || { echo 'VST3 bundle not found'; exit 1; }
          BIN="$VST/Contents/MacOS/Console Channel Strip X"
          test -f "$BIN" || { echo 'VST3 executable not found'; exit 1; }
          file "$BIN" | tee binary-info.txt
          file "$BIN" | grep -q 'x86_64' || { echo 'ERROR: binary is not x86_64'; exit 1; }
          VTOOL_OUTPUT=$(xcrun vtool -show-build "$BIN")
          printf '%s\n' "$VTOOL_OUTPUT" | tee deployment-info.txt
          MINOS=$(printf '%s\n' "$VTOOL_OUTPUT" | awk '
            $1 == "minos" { print $2; exit }
            /LC_VERSION_MIN_MACOSX/ { legacy=1; next }
            legacy && $1 == "version" { print $2; exit }
          ')
          test -n "$MINOS" || { echo 'Could not determine deployment target'; exit 1; }
          echo "Detected minimum macOS: $MINOS"
          python3 - "$MINOS" <<'PY'
          import sys
          parts = tuple(int(x) for x in sys.argv[1].split('.')[:2])
          if parts > (10, 13):
              raise SystemExit(f'ERROR: deployment target {sys.argv[1]} is newer than macOS 10.13')
          PY

      - name: Collect artifact
        shell: bash
        run: |
          mkdir -p artifact
          VST=$(find build -type d -name 'Console Channel Strip X.vst3' -print -quit)
          ditto "$VST" 'artifact/Console Channel Strip X.vst3'
          cp binary-info.txt deployment-info.txt artifact/
          ditto -c -k --sequesterRsrc --keepParent 'artifact/Console Channel Strip X.vst3' ConsoleChannelStrip-X-v0.1.1-macOS-Intel.zip

      - name: Upload Intel VST3
        uses: actions/upload-artifact@v4
        with:
          name: ConsoleChannelStrip-X-v0.1.1-macOS-Intel
          path: |
            ConsoleChannelStrip-X-v0.1.1-macOS-Intel.zip
            artifact/binary-info.txt
            artifact/deployment-info.txt
          if-no-files-found: error
          retention-days: 30
