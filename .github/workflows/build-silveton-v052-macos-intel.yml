name: Build Silveton Channel Strip v0.5.2 macOS Intel

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
      - 'Silveton-v0.5.2-GitHub-ready.zip'
      - '.github/workflows/build-silveton-v052-macos-intel.yml'

concurrency:
  group: silveton-channel-strip-v052-macos-intel
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Silveton v0.5.2 source
        shell: bash
        run: |
          set -euo pipefail

          BASE='ConsoleChannelStrip-X-v0.4.1-Wien-RC-source.zip'
          OVERLAY='Silveton-v0.5.2-GitHub-ready.zip'

          test -f "$BASE" || { echo 'Baseline ZIP not found'; exit 1; }
          test -f "$OVERLAY" || { echo 'Silveton overlay ZIP not found'; exit 1; }

          rm -rf silveton-src overlay build artifact
          mkdir -p silveton-src overlay
          ditto -x -k "$BASE" silveton-src
          ditto -x -k "$OVERLAY" overlay

          CMAKE_FILE=$(find silveton-src -maxdepth 4 -name CMakeLists.txt -print -quit)
          test -n "$CMAKE_FILE" || { echo 'CMakeLists.txt not found'; exit 1; }
          ROOT=$(dirname "$CMAKE_FILE")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          cp overlay/src/PluginEditor.cpp "$ROOT/src/PluginEditor.cpp"
          cp overlay/src/PluginEditor.h "$ROOT/src/PluginEditor.h"
          cp overlay/src/PluginProcessor.cpp "$ROOT/src/PluginProcessor.cpp"
          cp overlay/src/PluginProcessor.h "$ROOT/src/PluginProcessor.h"
          cp overlay/approved-visual-reference.png "$ROOT/src/approved_visual_reference.png"

          PROJECT_ROOT="$ROOT" python3 - <<'PYCODE'
          from pathlib import Path
          import os, re

          root = Path(os.environ['PROJECT_ROOT'])
          cmake = root / 'CMakeLists.txt'
          s = cmake.read_text()

          replacements = [
              (r'project\(ConsoleChannelStripX VERSION [0-9.]+ LANGUAGES C CXX\)',
               'project(ConsoleChannelStripX VERSION 0.5.2 LANGUAGES C CXX)'),
              (r'COMPANY_NAME "OpenWorkstation X"', 'COMPANY_NAME "Silveton"'),
              (r'BUNDLE_ID "com\.openworkstationx\.consolechannelstripx"',
               'BUNDLE_ID "com.silveton.channelstrip"'),
              (r'PLUGIN_MANUFACTURER_CODE OwX1', 'PLUGIN_MANUFACTURER_CODE SilV'),
              (r'PLUGIN_CODE CsX1', 'PLUGIN_CODE SCS5'),
              (r'PRODUCT_NAME "Console Channel Strip X"', 'PRODUCT_NAME "Silveton Channel Strip"'),
              (r'DESCRIPTION "E-series inspired console channel strip"',
               'DESCRIPTION "Silveton Channel Strip"'),
          ]

          for pattern, replacement in replacements:
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('Required CMake branding patch failed: ' + pattern)

          if 'juce_add_binary_data(SilvetonVisualAssets' not in s:
              binary_block = '''juce_add_binary_data(SilvetonVisualAssets
              NAMESPACE BinaryData
              SOURCES
                  src/approved_visual_reference.png
          )

          '''
              s = s.replace('juce_add_plugin(ConsoleChannelStripX',
                            binary_block + 'juce_add_plugin(ConsoleChannelStripX', 1)

          if 'SilvetonVisualAssets\n    juce::juce_audio_utils' not in s:
              s, n = re.subn(
                  r'target_link_libraries\(ConsoleChannelStripX PRIVATE\s*\n\s*juce::juce_audio_utils',
                  'target_link_libraries(ConsoleChannelStripX PRIVATE\n    SilvetonVisualAssets\n    juce::juce_audio_utils',
                  s,
                  count=1)
              if n != 1:
                  raise SystemExit('Could not link Silveton visual asset')

          cmake.write_text(s)
          PYCODE

      - name: Configure Intel VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$PROJECT_ROOT" -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target ConsoleChannelStripX_VST3 --parallel 4

      - name: Package VST3
        shell: bash
        run: |
          set -euo pipefail
          VST=$(find build -type d -name 'Silveton Channel Strip.vst3' -print -quit)
          test -n "$VST" || { echo 'Silveton Channel Strip.vst3 not found'; exit 1; }

          mkdir -p artifact
          ditto "$VST" 'artifact/Silveton Channel Strip.vst3'
          ditto -c -k --sequesterRsrc --keepParent \
            'artifact/Silveton Channel Strip.vst3' \
            Silveton-Channel-Strip-v0.5.2-macOS-Intel.zip

      - name: Upload Silveton v0.5.2
        uses: actions/upload-artifact@v4
        with:
          name: Silveton-Channel-Strip-v0.5.2-macOS-Intel
          if-no-files-found: error
          path: Silveton-Channel-Strip-v0.5.2-macOS-Intel.zip
